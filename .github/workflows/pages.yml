name: Wdróż grę na GitHub Pages

on:
  push:
    branches: ["main"]

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.head_commit.message == 'Publikacja gry'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test -f site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
